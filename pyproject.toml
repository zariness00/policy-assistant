[project]
name = "policy-assistant-mcp"
version = "0.1.0"
description = "MCP server that helps insurance brokers answer coverage questions from public policy wordings, with citations, PII redaction and human sign-off."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.10,<2",
    "chromadb>=1.0,<2",
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
policy-assistant = "policy_assistant.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["policy_assistant*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
